M 102.7,95 C 102.7,87.6 99.65,83.8 94.75,83.8 C 89.35,83.8 86.15,87.75 86.15,95.05 C 86.15,102.2 89.35,106.05 94.75,106.05 C 99.7,106.05 102.7,102.25 102.7,95 Z"/>
  <path id="seta" pathLength="1" d="M 165.85,55.65 H 183.8 V 73.55 M 183.8,55.65 L 161.15,78.05" stroke="#DFF793" stroke-width="5.7" stroke-linecap="round" stroke-linejoin="round"/>
